{% load django_bootstrap5 static %}
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Сокращение ссылок{% endblock %}</title>
  {% bootstrap_css %}
  <link rel="stylesheet" href="{% static 'shortener/styles.css' %}">
</head>
<body>
  {% include 'shortener/includes/navbar.html' %}
  <main class="container py-4">
    {% block content %}{% endblock %}
  </main>
  {% include 'shortener/includes/toasts.html' %}
  {% bootstrap_javascript %}
  <script src="{% static 'shortener/app.js' %}"></script>
</body>
</html>
